[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-forecasting"
version = "1.0.0"
description = "Leak-free, memory-efficient marine oceanographic anomaly detection pipeline (ORCA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ORCA" }]
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
service = ["fastapi>=0.104", "uvicorn[standard]>=0.24", "pydantic>=2.0"]
onnx = ["skl2onnx>=1.16", "onnx>=1.15", "onnxruntime>=1.16"]
viz = ["folium>=0.15"]
dev = ["pytest>=7.4", "httpx>=0.25"]

[project.scripts]
orca-convert = "scripts.convert_csv_to_parquet:main"
orca-train = "scripts.run_training:main"
orca-infer = "scripts.run_inference:main"

[tool.setuptools]
packages = ["orca", "service", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
